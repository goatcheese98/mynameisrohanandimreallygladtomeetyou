name: Portfolio quality
on:
  pull_request:
  push:
    branches:
      [codex/lum-portfolio-accessibility, codex/lum-portfolio-static-cloudflare]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:verify
      - run: npm run check:cloudflare
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-static
          path: |
            dist
            wrangler.jsonc
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
